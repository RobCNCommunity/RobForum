<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      try {
        const stored = localStorage.getItem('robforum:color-theme')
        const theme = stored === 'light' || stored === 'dark'
          ? stored
          : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.dataset.theme = theme
        document.documentElement.classList.toggle('nut-theme-dark', theme === 'dark')
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#000000' : '#ffffff'
      } catch (error) {
        document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      }
    </script>
    <link rel="stylesheet" href="/fonts/misans/MiSans-Regular.min.css" />
    <title>罗布玩家社区</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
